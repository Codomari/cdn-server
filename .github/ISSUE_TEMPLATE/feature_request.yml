name: Feature request
description: Suggest a new capability or improvement.
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe what you want to accomplish and the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example request or configuration if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
